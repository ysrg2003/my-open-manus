name: Run OpenManus with Gemini

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'The prompt to run OpenManus with'
        required: true
        default: 'Hello OpenManus, can you tell me a joke?'

jobs:
  run-openmanus:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Configure OpenManus for Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Use the config file we prepared
          cp config/config.toml config/config_final.toml
          # Replace the placeholder with the actual API key from secrets
          sed -i "s/GEMINI_API_KEY_PLACEHOLDER/$GEMINI_API_KEY/g" config/config.toml

      - name: Run OpenManus
        run: |
          python main.py --prompt "${{ github.event.inputs.prompt }}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openmanus-workspace
          path: workspace/
